version: '3.8'

services:
  officialsite:
    build: .
    container_name: jski-official
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - payment-data:/app/data   # SQLite 订单数据持久化（不挂则容器重建丢数据）
    networks:
      - jski-network

networks:
  jski-network:
    driver: bridge

volumes:
  payment-data:
